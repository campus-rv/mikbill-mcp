[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mb-mcp"
version = "0.1.0"
description = "MCP server for the Mikbill admin API (see SPEC.md)"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.3,<3",
    "httpx>=0.27",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.6",
    "mypy>=1.11",
    "pip-audit>=2.7",
]

[project.scripts]
mb-mcp = "mb_mcp.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mb_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["contract: live tests that write to a real Mikbill (opt-in, see tests/contract/test_demo.py)"]
pythonpath = ["src"]

[tool.ruff]
line-length = 130
src = ["src", "tests"]

[tool.ruff.lint]
# pyflakes and the pycodestyle error classes, import order, likely bugs (B) and the bandit security checks (S)
select = ["E4", "E7", "E9", "F", "I", "B", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]   # asserts, fixed test secrets and subprocess calls to docker are what tests are made of
"tests/contract/**" = ["S", "E702", "E741"]   # the live suite pairs each call with its cleanup on one line

[tool.mypy]
python_version = "3.12"
files = ["src"]
warn_unused_ignores = true
warn_redundant_casts = true
