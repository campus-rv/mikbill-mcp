name: ci

# Pull requests and pushes to main: lint, type check and dependency audit; unit tests; then build the image for amd64
# and arm64, run the Docker smoke test and scan the image. Pushes to main and version tags (v*) also publish the
# multi-arch image to ghcr.io.
#
# Supply chain: actions are pinned to a commit (the comment names the release), Python packages come from the
# hash-pinned lock files (scripts/lock.sh), and the base image is pinned by digest in the Dockerfile. Dependabot
# (.github/dependabot.yml) proposes the updates.
#
#   main      -> ghcr.io/<owner>/<repo>:edge and :sha-<commit>
#   v1.2.3    -> :1.2.3, :1.2, :latest and :sha-<commit>
#
# No secrets are needed: the job logs in to ghcr.io with the built-in GITHUB_TOKEN.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Lint, types, dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.15"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      # Every package from the lock file, with hashes. The project itself is not installed: pytest and mypy read it
      # from src/ (pyproject.toml), which avoids fetching an unpinned build backend for an editable install.
      - run: python -m pip install --require-hashes -r requirements-dev.lock
      # pyflakes, import order, likely bugs and the bandit security rules ([tool.ruff] in pyproject.toml)
      - run: python -m ruff check src tests
      - run: python -m mypy
      # Known vulnerabilities in what the image installs (requirements.lock) and in the dev tools
      - run: python -m pip_audit -r requirements.lock --require-hashes --disable-pip --progress-spinner off
      - run: python -m pip_audit -r requirements-dev.lock --require-hashes --disable-pip --progress-spinner off
      # The lock files must match pyproject.toml: a dependency added there without relocking fails here
      - run: python scripts/check_locks.py

  unit:
    name: Unit tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.lock
      # Every package from the lock file, with hashes. The project itself is not installed: pytest and mypy read it
      # from src/ (pyproject.toml), which avoids fetching an unpinned build backend for an editable install.
      - run: python -m pip install --require-hashes -r requirements-dev.lock
      # The contract tests (live Mikbill) and the Docker smoke tests are opt-in and skip themselves here.
      - run: python -m pytest -q

  image:
    name: Image (amd64, arm64), smoke test, scan, publish
    needs: [checks, unit]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      PUBLISH: ${{ github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130  # v3.7.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051  # v5.10.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=edge,branch=main
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
          labels: |
            org.opencontainers.image.title=mikbill-mcp
            org.opencontainers.image.description=MCP server for the Mikbill admin API

      # amd64 image, loaded into the local Docker so the smoke test can run it
      - name: Build amd64 image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6.19.2
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: mb-mcp:ci
          cache-from: type=gha,scope=amd64
          cache-to: type=gha,scope=amd64,mode=max

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.15"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      # Every package from the lock file, with hashes. The project itself is not installed: pytest and mypy read it
      # from src/ (pyproject.toml), which avoids fetching an unpinned build backend for an editable install.
      - run: python -m pip install --require-hashes -r requirements-dev.lock

      # Starts the image against a fake Mikbill: HTTP, bearer token, scopes, gating, /health, the Docker health
      # check, a changed port, and stdio mode.
      - name: Smoke test (amd64)
        env:
          MB_SMOKE: "1"
          MB_SMOKE_IMAGE: mb-mcp:ci
        run: python -m pytest tests/smoke -v

      # Known vulnerabilities in the image that have a fix: OS packages and Python packages. A finding fails the
      # build, so nothing with a fixable HIGH or CRITICAL issue is published.
      - name: Scan image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: mb-mcp:ci
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      # arm64 runs under QEMU, so it gets a lighter check: the image starts, answers /health and lists its tools.
      # It is built here in CI only. A local arm64 build takes over 10 minutes, so do not build it by hand.
      - name: Build arm64 image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6.19.2
        with:
          context: .
          platforms: linux/arm64
          load: true
          tags: mb-mcp:ci-arm64
          cache-from: type=gha,scope=arm64
          cache-to: type=gha,scope=arm64,mode=max

      - name: Smoke test (arm64)
        run: |
          set -euo pipefail
          docker image inspect -f '{{.Os}}/{{.Architecture}}' mb-mcp:ci-arm64
          docker run --rm --platform linux/arm64 mb-mcp:ci-arm64 --list-endpoints | tail -n 2
          cid=$(docker run -d --rm --platform linux/arm64 -p 127.0.0.1:8000:8000 \
            -e MB_BASE_URL=http://127.0.0.1:1 -e MB_INSECURE_HTTP=1 -e MB_LOGIN=ci -e MB_PASSWORD=ci \
            -e MCP_HTTP_BEARER_TOKEN=ci-arm64-bearer-token mb-mcp:ci-arm64)
          trap 'docker rm -f "$cid" >/dev/null' EXIT
          # Poll /health from the runner. The container's own Docker health check is not used here: under QEMU,
          # starting its Python takes longer than the check's 3 s timeout, so it reports unhealthy although the
          # server answers (seen on a local emulated run). On real arm64 hardware the check is fine.
          for _ in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8000/health && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:8000/health || { docker logs "$cid"; exit 1; }
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8000/mcp)" = 401

      - name: Log in to ghcr.io
        if: env.PUBLISH == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Reuses the layers built above (both caches), then pushes one multi-arch manifest.
      - name: Build and push (amd64 + arm64)
        if: env.PUBLISH == 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6.19.2
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=gha,scope=amd64
            type=gha,scope=arm64

      - name: Published tags
        if: env.PUBLISH == 'true'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo '### Published'
            echo
            echo '```'
            echo "$TAGS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
